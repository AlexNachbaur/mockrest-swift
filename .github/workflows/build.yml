name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs on the same branch are pointless once a newer commit exists.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository; the default token permissions are wider than needed.
permissions:
  contents: read

# Job topology is three tiers, deliberately serial at the top:
#
#   lint  ->  linux  ->  { macos, ios, windows, android }
#
# `lint` is the canary: it takes seconds on the cheapest runner, and a formatting failure
# blocks a merge just as surely as a compile failure does, so nothing else should start until
# it passes. `linux` is the second gate for the same reason — it is the cheapest runner that
# actually builds and runs the whole suite (GitHub bills Linux at 1x, Windows at 2x and macOS
# at 10x), so a commit that does not compile is rejected before an expensive or slow runner is
# spent on it. The Android job is cheap per-minute but by far the slowest, since it boots an
# emulator, so it sits in the same tier.
#
# The cost is wall-clock on a passing run. That is the right trade for a library: pushes are
# infrequent and a red build is not an outage.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7
      - name: swift-format
        run: swift format lint --strict --recursive Sources Tests Package.swift

  linux:
    name: Build & Test (Linux)
    needs: lint
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  macos:
    name: Build & Test (macOS)
    needs: linux
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          # Package.resolved is deliberately not committed — pinning a resolution in a
          # library repository forces it on every consumer — so hashing it would produce an
          # empty digest and a cache key that never changes. Package.swift is what actually
          # declares the dependency versions here.
          key: macos-spm-${{ hashFiles('Package.swift') }}
          restore-keys: macos-spm-
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  ios:
    name: Build & Test (iOS Simulator)
    needs: linux
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      # SwiftPM cannot run a test bundle on a simulator, so the iOS leg goes through xcodebuild
      # against the scheme Xcode synthesises for the package. This is the only job that proves
      # the iOS deployment target in Package.swift is real rather than merely declared — which
      # matters because driving XCUITest from a simulator is the primary use case for
      # everything built on MockREST.
      - name: Build & test
        run: |
          xcodebuild test \
            -scheme MockREST-Package \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'

  windows:
    name: Build & Test (Windows)
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # SwiftyLab/setup-swift is the only maintained action that installs a Swift toolchain on
      # all three host platforms, and it wires up the MSVC environment Swift needs on Windows.
      # It publishes no moving major tag, so this is pinned to an exact release and left to
      # Dependabot's github-actions ecosystem to bump.
      - uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: '6.3'
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  android:
    name: Build & Test (Android)
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Runs the suite in an emulator rather than merely cross-compiling, so the Android leg
      # asserts behaviour and not just that the code type-checks. The action manages its own
      # toolchain/SDK/NDK caching.
      - name: Build and test on Android emulator
        uses: skiptools/swift-android-action@v2
        with:
          swift-version: '6.3'
          android-api-level: 28
          free-disk-space: true
